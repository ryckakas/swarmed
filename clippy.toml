# `excessive_nesting` is silent until a threshold is set; 3 is the value its own documentation uses.
excessive-nesting-threshold = 3
# `cognitive_complexity` defaults to 25; 15 is the usual ceiling for a function read in one go.
cognitive-complexity-threshold = 15
# Product names written in CamelCase are names, not identifiers that want backticks.
doc-valid-idents = ["OpenRouter", "OpenCode", "DevTools", "WebSocket", ".."]
