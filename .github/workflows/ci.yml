name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only reads the checkout: nothing here pushes, comments or publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Where the jobs run is a repository variable, CI_RUNNER: unset, they run on GitHub's runners;
# set to the label of a self-hosted runner, they run there. That machine keeps its own tools
# (Rust, Node, pnpm, typos, taplo, shellcheck, actionlint, cargo-deny, cargo-shear, zizmor), so
# the steps that install them are skipped on it, and so is the cache: its checkout stays.

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A self-hosted runner keeps its checkout, and with it what was already built.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Install stable Rust
        if: runner.environment == 'github-hosted'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component rustfmt,clippy
          rustup default stable

      # Tauri links against the system web view, which Linux has to be given.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      # The app embeds ui/dist at compile time. The UI job builds the real one; the Rust jobs
      # only need the directory to exist.
      - name: Stand in for the built UI
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The lint policy, including the complexity limits, lives in Cargo.toml and clippy.toml.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A broken intra-doc link only shows when the docs are built, which nothing else here does.
      - name: Docs
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # An exact release, since each one adds corrections; Dependabot proposes the next one.
      - name: Spelling
        if: runner.environment == 'github-hosted'
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

      # The action runs in a container, which a Mac has none of.
      - name: Spelling, with the runner's own typos
        if: runner.environment != 'github-hosted'
        run: typos

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.environment == 'github-hosted'
        with:
          tool: taplo,shellcheck@0.11.0

      - name: TOML formatting
        run: taplo fmt --check

      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # install-action has no actionlint, so the release archive is pinned by its hash, the way the
      # actions are pinned by commit. It finds shellcheck on the PATH and runs it over `run:` blocks.
      - name: Install actionlint
        if: runner.environment == 'github-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          mkdir bin
          tar -xzf "$archive" -C bin actionlint
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Workflows
        run: actionlint

  dependencies:
    # deny.toml holds the policy: advisories, licenses, duplicate crates and allowed sources.
    name: Dependencies
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A self-hosted runner keeps its checkout, and with it what was already built.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Install stable Rust
        if: runner.environment == 'github-hosted'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.environment == 'github-hosted'
        with:
          tool: cargo-deny,cargo-shear

      - name: cargo deny
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear

  workflows:
    # Workflows are audited like code: pinned actions, least-privilege tokens, no template injection.
    name: Workflow security
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A self-hosted runner keeps its checkout, and with it what was already built.
          clean: ${{ runner.environment == 'github-hosted' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.environment == 'github-hosted'
        with:
          tool: zizmor@1.30.1

      # The token lets zizmor check that every pinned commit belongs to its action's repository.
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  ui:
    name: UI
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A self-hosted runner keeps its checkout, and with it what was already built.
          clean: ${{ runner.environment == 'github-hosted' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          node-version: 22

      # pnpm comes from Corepack, at the version package.json pins.
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # bonsai-lint: cognitive complexity, the same limit clippy enforces on the Rust side.
      - name: Complexity
        run: pnpm complexity

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  test:
    # Swarmed is a macOS app first, so that is where the tests have to pass. Linux is kept
    # working because nothing in the core should be tied to one platform.
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A self-hosted runner is one machine, so the tests run once, there.
        os: ${{ fromJSON(vars.CI_RUNNER && format('["{0}"]', vars.CI_RUNNER) || '["macos-latest", "ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A self-hosted runner keeps its checkout, and with it what was already built.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Install stable Rust
        if: runner.environment == 'github-hosted'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy
          rustup default stable

      # Tauri links against the system web view, which Linux has to be given.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      # The app embeds ui/dist at compile time. The UI job builds the real one; the Rust jobs
      # only need the directory to exist.
      - name: Stand in for the built UI
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'

      - name: Test
        run: cargo test --workspace --all-features

      # The lint job's Clippy runs on Linux when GitHub's runners are used, where the code only
      # a Mac compiles (the notifications, the Dock) is left out. It is held to the same policy
      # here. On a self-hosted Mac the lint job has done this already.
      - name: Clippy, for what only a Mac compiles
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
