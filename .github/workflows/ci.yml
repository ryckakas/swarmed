name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only reads the checkout: nothing here pushes, comments or publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component rustfmt,clippy
          rustup default stable

      # Tauri links against the system web view, which Linux has to be given.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      # The app embeds ui/dist at compile time. The UI job builds the real one; the Rust jobs
      # only need the directory to exist.
      - name: Stand in for the built UI
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The lint policy, including the complexity limits, lives in Cargo.toml and clippy.toml.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A broken intra-doc link only shows when the docs are built, which nothing else here does.
      - name: Docs
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # An exact release, since each one adds corrections; Dependabot proposes the next one.
      - name: Spelling
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: taplo,shellcheck@0.11.0

      - name: TOML formatting
        run: taplo fmt --check

      # install-action has no actionlint, so the release archive is pinned by its hash, the way the
      # actions are pinned by commit. It finds shellcheck on the PATH and runs it over `run:` blocks.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          mkdir bin
          tar -xzf "$archive" -C bin actionlint
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Workflows
        run: actionlint

  dependencies:
    # deny.toml holds the policy: advisories, licenses, duplicate crates and allowed sources.
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny,cargo-shear

      - name: cargo deny
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear

  workflows:
    # Workflows are audited like code: pinned actions, least-privilege tokens, no template injection.
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1

      # The token lets zizmor check that every pinned commit belongs to its action's repository.
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # pnpm comes from Corepack, at the version package.json pins.
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # bonsai-lint: cognitive complexity, the same limit clippy enforces on the Rust side.
      - name: Complexity
        run: pnpm complexity

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  test:
    # Swarmed is a macOS app first, so that is where the tests have to pass. Linux is kept
    # working because nothing in the core should be tied to one platform.
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Tauri links against the system web view, which Linux has to be given.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      # The app embeds ui/dist at compile time. The UI job builds the real one; the Rust jobs
      # only need the directory to exist.
      - name: Stand in for the built UI
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --all-features
