name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only reads the checkout: nothing here pushes, comments or publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a PR makes the previous run's result irrelevant. On main every commit runs to
# the end, in a group of its own: a cancelled run there shows as failing on the README's badge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version rust-toolchain.toml pins, with its components.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # Tauri links against the system web view, which Linux has to be given.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      # The app embeds ui/dist at compile time. The UI job builds the real one; the Rust jobs
      # only need the directory to exist.
      - name: Stand in for the built UI
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The lint policy, including the complexity limits, lives in Cargo.toml and clippy.toml.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # A broken intra-doc link only shows when the docs are built, which nothing else here does.
      - name: Docs
        run: cargo doc --locked --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # An exact release, since each one adds corrections; Dependabot proposes the next one.
      - name: Spelling
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: taplo@0.10.0,shellcheck@0.11.0

      - name: TOML formatting
        run: taplo fmt --check

      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # install-action has no actionlint, so the release archive is pinned by its hash, the way the
      # actions are pinned by commit. It finds shellcheck on the PATH and runs it over `run:` blocks.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          mkdir bin
          tar -xzf "$archive" -C bin actionlint
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Workflows
        run: actionlint

  secrets:
    # A token or key committed by mistake, anywhere in the history: once pushed, it has to be
    # revoked, so this is the last place to catch one. A test's made-up token is marked
    # `gitleaks:allow` on its line.
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the last: a secret added and then removed is still in history.
          fetch-depth: 0

      # install-action has no gitleaks, so the release archive is pinned by its hash, as
      # actionlint's is.
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check
          mkdir bin
          tar -xzf "$archive" -C bin gitleaks
          echo "$PWD/bin" >> "$GITHUB_PATH"

      # Whatever it finds is redacted from the log, which anyone can read once the repository is
      # public.
      - name: gitleaks
        run: gitleaks git --redact --no-banner --verbose .

  dependencies:
    # deny.toml holds the policy: advisories, licenses, duplicate crates and allowed sources.
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0

      - name: cargo deny
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear

  workflows:
    # Workflows are audited like code: pinned actions, least-privilege tokens, no template injection.
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@1.30.1

      # The token lets zizmor check that every pinned commit belongs to its action's repository.
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # pnpm comes from Corepack, at the version package.json pins.
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # bonsai-lint: cognitive complexity, the same limit clippy enforces on the Rust side.
      - name: Complexity
        run: pnpm complexity

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  test:
    # Swarmed is a macOS app first, so that is where the tests have to pass. Linux is kept
    # working because nothing in the core should be tied to one platform.
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # Tauri links against the system web view, which Linux has to be given.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      # The app embeds ui/dist at compile time. The UI job builds the real one; the Rust jobs
      # only need the directory to exist.
      - name: Stand in for the built UI
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked --workspace --all-features

      # The lint job's Clippy runs on Linux, where the code only a Mac compiles (the
      # notifications, the Dock) is left out. It is held to the same policy here.
      - name: Clippy, for what only a Mac compiles
        if: runner.os == 'macOS'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
