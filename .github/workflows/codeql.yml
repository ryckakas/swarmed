name: CodeQL

# Code scanning, on every pull request and on main. There is no schedule: the code only changes
# through these, and so do its dependencies, by Dependabot's pull requests.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A new push to a PR makes the previous run's result irrelevant. On main every commit runs to
# the end, in a group of its own: a cancelled run there shows as failing on the README's badge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Every language CodeQL reads that the repository has: the workflows, the UI, the test
        # fixture's agent, the Homebrew cask and the crates. CodeQL fails on a language with no
        # code, so one is added here when its first file is.
        language: [actions, javascript-typescript, python, ruby, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # None of them needs building to be read, Rust included.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      # The category is the one GitHub's default setup used, so its alerts carry over.
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
