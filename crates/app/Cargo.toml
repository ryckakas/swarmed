[package]
name = "swarmed-app"
description = "The Swarmed desktop app: a Tauri shell over swarmed-core"
# It embeds ui/dist, which a crate cannot carry, and a bare binary is not an app bundle: the app
# ships as Swarmed.app from the GitHub release instead.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
swarmed-core = { workspace = true }
serde = { workspace = true }
# `tauri::generate_context!` writes the plugins' configuration out as `serde_json` values.
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

# The system's notifications, where there is a system we know how to ask.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = { workspace = true }
mac-usernotifications = { workspace = true }
# For asking the notification centre for the badge on the icon too, which the wrapper leaves out.
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-user-notifications = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
