[package]
name = "swarmed-core"
description = "Headless core of the swarmed command, which requires it at its own version; its API is not stable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
pty-process = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = { workspace = true }

# The Keychain, where API keys are kept, and cloning a whole folder in one call for snapshots.
[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true }
security-framework = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
