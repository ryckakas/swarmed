[package]
# Named after the product, so `cargo install swarmed` installs the `swarmed` command.
name = "swarmed"
description = "Run coding agents side by side, each in its own git worktree: the swarmed command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "swarmed"
path = "src/main.rs"

[dependencies]
swarmed-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
